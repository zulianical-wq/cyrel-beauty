      if (existing) {
        return prev.map((i) => (i.id === product.id ? { ...i, qty: i.qty + 1 } : i));
      }
      return [...prev, { ...product, qty: 1 }];
    });

        .filter((i) => i.qty > 0)

                <div className="mt-8 pt-5 border-t" style={{ borderColor: THEME.secondary }}>
                  <div className="flex items-center justify-between mb-5">
                    <span className="text-sm font-medium opacity-70">Total</span>
                    <span className="text-lg font-bold" style={{ color: THEME.text }}>
                      {formatIDR(cartTotal)}
                    </span>
                  </div>
                  <button
                    onClick={() => {
                      setCartOpen(false);
                      setCheckoutOpen(true);
                    }}
                    className="w-full rounded-full py-3 text-sm font-semibold text-white flex items-center justify-center gap-1.5"
                    style={{ backgroundColor: THEME.accent }}
                  >
                    Checkout <ChevronRight size={16} />
                  </button>
                </div>
              </>
            )}
          </div>
        </div>
      )}

      {/* Checkout modal */}
      {checkoutOpen && (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center bg-black/30 p-4"
          onClick={() => {
            setCheckoutOpen(false);
            setOrderPlaced(false);
          }}
        >
          <div
            className="bg-white rounded-[28px] w-full max-w-md p-6 relative max-h-[90vh] overflow-y-auto"
            onClick={(e) => e.stopPropagation()}
          >
            <button
              onClick={() => {
                setCheckoutOpen(false);
                setOrderPlaced(false);
              }}
              className="absolute top-4 right-4 w-8 h-8 rounded-full flex items-center justify-center"
              style={{ backgroundColor: THEME.secondary }}
            >
              <X size={16} color={THEME.accent} />
            </button>

            {orderPlaced ? (
              <div className="text-center py-8">
                <p className="text-4xl mb-3">🎉</p>
                <h3 className="text-lg font-bold" style={{ color: THEME.text }}>
                  Pesanan Berhasil!
                </h3>
                <p className="text-sm opacity-70 mt-2">Terima kasih sudah belanja di Cyrel Beauty 💗</p>
                <button
                  onClick={() => {
                    setCart([]);
                    setCheckoutOpen(false);
                    setOrderPlaced(false);
                  }}
                  className="mt-6 px-6 py-2.5 rounded-full text-white text-sm font-semibold"
                  style={{ backgroundColor: THEME.accent }}
                >
                  Selesai
                </button>
              </div>
            ) : (
              <form
                onSubmit={(e) => {
                  e.preventDefault();
                  const formData = new FormData(e.target);
                  const nama = formData.get("nama");
                  const hp = formData.get("hp");
                  const alamat = formData.get("alamat");
                  const itemsList = cart
                    .map((item) => `- ${item.name} x${item.qty} (${formatIDR(item.price * item.qty)})`)
                    .join("\n");
                  const message = `Halo Cyrel Beauty! Saya ingin membuat pesanan 🎀\n\nNama: ${nama}\nNomor HP: ${hp}\nAlamat: ${alamat}\n\nPesanan:\n${itemsList}\n\nTotal: ${formatIDR(cartTotal)}`;
                  openWhatsApp(message);
                  setOrderPlaced(true);
                }}
              >
                <h3 className="text-lg font-bold mb-5" style={{ color: THEME.text }}>
                  Checkout 🎀
                </h3>
                <div className="flex flex-col gap-3">
                  <input name="nama" required placeholder="Nama Lengkap" className="rounded-2xl px-4 py-2.5 text-sm outline-none" style={{ backgroundColor: THEME.secondary }} />
                  <input name="hp" required placeholder="Nomor HP" className="rounded-2xl px-4 py-2.5 text-sm outline-none" style={{ backgroundColor: THEME.secondary }} />
                  <textarea name="alamat" required placeholder="Alamat Pengiriman" rows={3} className="rounded-2xl px-4 py-2.5 text-sm outline-none resize-none" style={{ backgroundColor: THEME.secondary }} />
                </div>

                <div className="mt-5 pt-4 border-t text-sm" style={{ borderColor: THEME.secondary }}>
                  {cart.map((item) => (
                    <div key={item.id} className="flex justify-between py-1 opacity-70">
                      <span>
                        {item.name} × {item.qty}
                      </span>
                      <span>{formatIDR(item.price * item.qty)}</span>
                    </div>
                  ))}
                  <div className="flex justify-between font-bold mt-2 pt-2 border-t" style={{ borderColor: THEME.secondary, color: THEME.text }}>
                    <span>Total</span>
                    <span>{formatIDR(cartTotal)}</span>
                  </div>
                </div>

                <button
                  type="submit"
                  className="mt-6 w-full rounded-full py-3 text-sm font-semibold text-white"
                  style={{ backgroundColor: THEME.accent }}
                >
                  Buat Pesanan via WhatsApp 💬
                </button>
              </form>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

const root = createRoot(document.getElementById("root"));
root.render(<CyrelBeauty />);
</script>
</body>
</html>
